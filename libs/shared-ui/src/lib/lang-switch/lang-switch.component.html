@let lang = currentLanguage();

<button
  class="lang-switch__trigger"
  [matMenuTriggerFor]="menu"
  i18n-aria-label="@@langSwitch.ariaLabel"
  aria-label="Change language"
>
  <span class="lang-switch__code">{{ currentLabel() }}</span>
  <mat-icon class="lang-switch__chevron">expand_more</mat-icon>
</button>

<!--
  `header-menu` (styled in the app's material.scss) drops the panel clear of the
  sticky bar. The switch is a header-only control, so the coupling is honest.
-->
<mat-menu #menu="matMenu" class="header-menu">
  @for (language of languages; track language.code) {
    <button
      mat-menu-item
      [class.lang-switch__item--active]="language.code === lang"
      [attr.aria-current]="language.code === lang ? 'true' : null"
      (click)="switchLanguage(language.code)"
    >
      <span class="lang-switch__flag" aria-hidden="true">{{
        language.flag
      }}</span>
      <span>{{ language.name }}</span>
    </button>
  }
</mat-menu>
